name: Sync Visitor Counter

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update-counter.js"

permissions:
  contents: write

jobs:
  update-counter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Visitor Count SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/update-counter.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visitor-count.svg data/views.json
          if git diff --staged --quiet; then
            echo "No changes in visitor count."
          else
            git commit -m "chore(counter): sync visitor count [skip ci]"
            git push
          fi
